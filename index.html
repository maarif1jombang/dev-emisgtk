        //        // ======= FUNCTIONS =======
        
        // Ganti Tab
        function switchTab(tab) {
            activeTab = tab;
            renderApp();
        }

        // Render Bagian Tab Navigasi
        function renderTabs() {
            const container = document.getElementById('tabs-container');
            
            const baseClass = "h-9 px-4 md:px-5 rounded-full font-medium text-xs md:text-sm flex items-center justify-center gap-2 transition-colors whitespace-nowrap outline-none focus:ring-2 focus:ring-brand focus:ring-offset-1";
            const activeClass = "bg-brand text-white shadow-sm";
            const inactiveClass = "bg-gray-200 text-gray-600 hover:bg-gray-300";

            container.innerHTML = `
                
                <button onclick="switchTab('menu')" class="${baseClass} ${activeTab === 'menu' ? activeClass : inactiveClass}">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    Menu GTK
                </button>
				<button onclick="switchTab('admin')" class="${baseClass} ${activeTab === 'admin' ? activeClass : inactiveClass}">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    Menu Admin
                </button>
            `;
        }

        // Render HTML untuk Daftar Menu dengan parameter data agar dapat disesuaikan (Menu atau Admin)
        function getMenuHTML(menuSourceData, searchQuery = '') {
            let html = '';
            let hasResult = false;
            const lowerQuery = searchQuery.toLowerCase();

            menuSourceData.forEach(group => {
                // Filter item berdasarkan nama menu atau deskripsi
                const filteredItems = group.items.filter(item => 
                    item.title.toLowerCase().includes(lowerQuery) || 
                    item.desc.toLowerCase().includes(lowerQuery)
                );

                if (filteredItems.length > 0) {
                    hasResult = true;
                    html += `
                    <div class="menu-section">
                        <div class="flex items-center gap-2 mb-2">
                            <i data-lucide="${group.icon}" class="w-4 h-4 md:w-5 md:h-5 text-brand"></i>
                            <h2 class="text-[13px] md:text-lg font-bold text-gray-800">${group.section}</h2>
                            <span class="bg-brand text-white text-[9px] md:text-xs font-bold px-1.5 py-0.5 rounded-full">${filteredItems.length}</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5 md:gap-3">
                    `;
                    
                    filteredItems.forEach(item => {
                        const targetUrl = item.url ? item.url : '#';
                        html += `
                            <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="bg-white border border-gray-200 rounded-xl p-2.5 md:p-3 flex items-center justify-between hover:border-brand hover:shadow-md transition-all duration-200 cursor-pointer group text-left outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2">
                                <div class="flex items-center gap-2.5 md:gap-3 flex-1 min-w-0">
                                    <div class="w-9 h-9 md:w-10 md:h-10 bg-brand-light text-brand rounded-full flex items-center justify-center shrink-0 group-hover:bg-brand group-hover:text-white transition-colors duration-200">
                                        <i data-lucide="${item.icon}" class="w-4.5 h-4.5 md:w-5 md:h-5"></i>
                                    </div>
                                    <div class="flex flex-col justify-center flex-1 min-w-0">
                                        <h3 class="font-semibold text-gray-800 text-[13px] md:text-sm line-clamp-1 group-hover:text-brand transition-colors duration-200 leading-tight">${item.title}</h3>
                                        <p class="text-[11px] md:text-xs text-gray-500 mt-0.5 leading-tight line-clamp-1">${item.desc}</p>
                                    </div>
                                </div>
                                <div class="text-gray-300 shrink-0 group-hover:text-brand transition-colors duration-200 transform group-hover:translate-x-1 ml-2">
                                    <i data-lucide="arrow-right" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                                </div>
                            </a>
                        `;
                    });
                    html += `</div></div>`;
                }
            });

            // Jika pencarian tidak membuahkan hasil
            if (!hasResult && searchQuery !== '') {
                html = `
                <div class="text-center py-10">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gray-100 text-gray-400 mb-3">
                        <i data-lucide="search-x" class="w-6 h-6"></i>
                    </div>
                    <p class="text-gray-500 font-medium">Tidak ada menu yang cocok dengan pencarian "${searchQuery}"</p>
                </div>`;
            }

            return html;
        }

        // Fungsi Induk untuk memanggil dan merender konten secara dinamis
        function renderApp() {
            renderTabs();
            
            const adminContainer = document.getElementById('admin-container');
            const menuContainer = document.getElementById('menu-container');

            // Reset display semuanya menjadi hidden
            adminContainer.style.display = 'none';
            menuContainer.style.display = 'none';

            // Tampilkan container sesuai dengan activeTab
            if (activeTab === 'admin') {
                adminContainer.style.display = 'block';
                adminContainer.innerHTML = getMenuHTML(menuAdminData, currentSearchQuery);
            } else if (activeTab === 'menu') {
                menuContainer.style.display = 'block';
                menuContainer.innerHTML = getMenuHTML(menuData, currentSearchQuery);
            }

            // Inisialisasi ikon
            lucide.createIcons();
        }

        // --- DOM CONTENT LOADED & EVENTS ---
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();

            // Event Listener Pencarian Data
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentSearchQuery = e.target.value;
                if (activeTab === 'admin') {
                    document.getElementById('admin-container').innerHTML = getMenuHTML(menuAdminData, currentSearchQuery);
                } else if (activeTab === 'menu') {
                    document.getElementById('menu-container').innerHTML = getMenuHTML(menuData, currentSearchQuery);
                }
                lucide.createIcons();
            });
        });

        // --- SCROLL EVENT UNTUK STICKY HEADER ---
        window.addEventListener('scroll', () => {
            const stickyHeader = document.getElementById('sticky-header');
            
            if (window.scrollY > 15) {
                stickyHeader.classList.add('shadow-[0_10px_20px_-10px_rgba(0,0,0,0.08)]');
            } else {
                stickyHeader.classList.remove('shadow-[0_10px_20px_-10px_rgba(0,0,0,0.08)]');
            }
        });
    </script>
</body>
</html>
